[project]
name = "evacuatesim-backend"
version = "0.1.0"
description = "EvacuateSim backend: discrete-time evacuation simulation, routing strategies, and REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["SIM108"]  # ternaries are often less readable in simulation code

[tool.ruff.lint.per-file-ignores]
# Test fixtures use fixtures/asserts liberally
"tests/*" = ["B008", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
